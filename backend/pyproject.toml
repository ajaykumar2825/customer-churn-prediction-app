[project]
name = "churn-platform-backend"
version = "1.0.0"
description = "FastAPI serving layer for the customer churn prediction platform"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["tests/*", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "UP006", "UP007"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --disable-warnings --no-header"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true